spring.application.name=manik-agro-pms
server.port=${PORT:8080}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manik_pms?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DB_DDL_MODE:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

pms.seed-demo-data=${PMS_SEED_DEMO_DATA:true}
